<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MintNews V4</title>
    
    <style>
        body.modal-open {
            overflow: hidden !important;
        }
        
        /* Absolute dynamic sheet overlay that forces 100% viewport width on mobile */
        .detailed-overlay, .script-modal-container, .premium-popup-box {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            top: auto !important;
            width: 100vw !important;
            max-width: 100vw !important;
            height: 85vh !important;
            background-color: #0d1117 !important;
            border-radius: 24px 24px 0 0 !important;
            box-shadow: 0 -12px 35px rgba(0,0,0,0.8) !important;
            z-index: 999999 !important;
            transform: none !important;
            margin: 0 !important;
            padding: 20px !important;
            overflow-y: auto !important;
            box-sizing: border-box !important;
            display: none;
        }

        .premium-popup-box.active {
            display: block !important;
        }

        .close-process-btn {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 16px;
            border-radius: 8px;
            float: right;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-dark text-white">

    <div id="premium-response-modal" class="premium-popup-box">
        <button class="close-process-btn" onclick="closePremiumModal()">✕ CLOSE PROCESS</button>
        <div style="margin-bottom: 15px;">
            <span style="color: #58a6ff; font-weight: bold; margin-right: 15px;">English</span>
            <span style="color: #8b949e;">Hindi</span>
            <span style="color: #8b949e;">Hinglish</span>
        </div>
        <hr style="border-color: #21262d;">
        <div id="premium-modal-loading" style="color: #8b949e; font-style: italic; margin-top: 20px;">
            ⚡ Initializing secure high-speed analytics with Mistral Production Core Engine...
        </div>
        <div id="premium-modal-text" style="line-height: 1.6; font-size: 16px; white-space: pre-wrap; margin-top: 15px;"></div>
    </div>

    <script>
        // Trigger action on Premium Buttons (Summary, Script, Tweet)
        function triggerPremiumAction(articleId, operationType) {
            const modal = document.getElementById('premium-response-modal');
            const loadingText = document.getElementById('premium-modal-loading');
            const contentText = document.getElementById('premium-modal-text');
            
            // 🔄 Hard Reset positions and layout state instantly
            modal.style.display = 'block';
            loadingText.style.display = 'block';
            contentText.innerText = '';
            document.body.classList.add('modal-open');

            fetch('/process-premium-action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    article_id: articleId,
                    operation: operationType,
                    language: 'Hinglish',
                    is_premium: true // Setting test context to true to bypass barrier
                })
            })
            .then(res => res.json())
            .then(data => {
                loadingText.style.display = 'none';
                if(data.status === 'success') {
                    contentText.innerText = data.result;
                } else {
                    contentText.innerText = data.result;
                }
            })
            .catch(err => {
                loadingText.style.display = 'none';
                contentText.innerText = 'Network error fetching data core matrix: ' + err;
            });
        }

        function closePremiumModal() {
            document.getElementById('premium-response-modal').style.display = 'none';
            document.body.classList.remove('modal-open');
        }
    </script>
</body>
</html>
